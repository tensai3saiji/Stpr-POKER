<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>STPRポーカー</title>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<style>
body { background:#222; color:white; text-align:center; font-family:sans-serif; }
input { padding:10px; margin:5px; }
button { padding:10px; }
</style>
</head>

<body>

<h1>🌐 STPRポーカー</h1>

<input id="name" placeholder="名前">
<input id="answer" placeholder="役を書く">
<button onclick="send()">送信</button>

<h2>みんなの回答</h2>
<div id="list"></div>

<script>
const firebaseConfig = {
  apiKey: "ここに自分のやつ",
  authDomain: "ここに自分のやつ",
  projectId: "ここに自分のやつ",
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

function send(){
  const cards = [
  "莉犬", "るぅと", "さとみ", "ジェル", "ななもり。",
  "ばぁう", "てるとくん", "しゆん", "タケヤキ翔", "からつけあっきぃ",
  "ぷりっつ", "まぜ太", "あっと", "ちぐさくん", "けちゃ", "心音", "Lapis", "メルト・ダ・テンシ",
  "みかさくん", "ロゼ", "明雷らいと", "らお", "ゆたくん",
  "たちばな", "おさでい", "だいきり", "やなと", "にしき", "パルオ", "つきしろやしろ。", "まひろまる。",
  "ものくろ", "そあら", "はりま"
];

function drawCards(){
  const shuffled = [...cards].sort(() => Math.random() - 0.5);
  return shuffled.slice(0, 5);
}

function send(){
  const name = document.getElementById("name").value;
  const answer = document.getElementById("answer").value;
  const hand = drawCards();

  db.collection("answers").add({
    name,
    answer,
    hand,
    votes: 0,
    time: Date.now()
  });
}

db.collection("answers").orderBy("time").onSnapshot(snapshot => {
  let html = "";

  snapshot.forEach(doc => {
    const data = doc.data();

    const handHtml = data.hand
      ? data.hand.map(card => `<span style="display:inline-block;background:white;color:black;padding:8px;margin:4px;border-radius:8px;">${card}</span>`).join("")
      : "";

    html += `
      <div style="margin:15px; padding:10px; border:1px solid #555;">
        <h3>${data.name}</h3>
        <div>${handHtml}</div>
        <p>役：${data.answer}</p>
        <button onclick="vote('${doc.id}')">投票</button>
        <span> ${data.votes || 0}票</span>
      </div>
    `;
  });

  document.getElementById("list").innerHTML = html;
});

  document.getElementById("list").innerHTML = html;
});
  function vote(id){
  db.collection("answers").doc(id).update({
    votes: firebase.firestore.FieldValue.increment(1)
  });
}
</script>

</body>
</html>

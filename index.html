<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>STPRポーカー</title>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<style>
body{
  background:#222;
  color:white;
  text-align:center;
  font-family:sans-serif;
  margin:0;
  padding:20px;
}

input{
  padding:10px;
  margin:5px;
  border:none;
  border-radius:8px;
}

button{
  padding:10px 15px;
  margin:5px;
  border:none;
  border-radius:8px;
  cursor:pointer;
}

.card{
  display:inline-block;
  background:white;
  color:black;
  padding:10px;
  margin:5px;
  border-radius:8px;
}

.selected{
  background:#ffd966;
}

.box{
  margin:15px auto;
  padding:10px;
  border:1px solid #555;
  border-radius:10px;
  max-width:650px;
}

.danger{
  background:#ff6b6b;
  color:white;
}
</style>
</head>

<body>

<h1>🌐 STPRポーカー</h1>

<input id="name" placeholder="名前">
<br>

<button onclick="drawMyHand()">手札を見る</button>
<button onclick="exchangeCards()">選んだカードを交換（1回だけ）</button>

<h2>自分の手札</h2>
<p>交換したいカードをタップして選んでね</p>
<div id="myHand"></div>

<br>

<input id="answer" placeholder="役を書く">
<button onclick="send()">役を発表</button>

<h2>みんなの発表</h2>
<button class="danger" onclick="resetRound()">次のラウンドへ（全発表を消す）</button>
<div id="list"></div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyD2y8WmkIMZuu_JuAWlBVh_E1mTdK1QV3A",
  authDomain: "stpr-poker.firebaseapp.com",
  projectId: "stpr-poker",
  storageBucket: "stpr-poker.firebasestorage.app",
  messagingSenderId: "272158826675",
  appId: "1:272158826675:web:c6487013df9d9bc4e990c6",
  measurementId: "G-KJJNRKQ8Z6"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

const cards = [
"莉犬","るぅと","ころん","さとみ","ジェル","ななもり。",
"ばぁう","てるとくん","しゆん","タケヤキ翔","からつけあっきぃ",
"まぜ太","ぷりっつ","あっと","ちぐさくん","けちゃ","心音",
"Lapis","メルト・ダ・テンシ","みかさくん","ロゼ","明雷らいと",
"ゆたくん","たちばな","おさでい","らお","やなと","だいきり",
"にしき","パルオ","つきしろやしろ。","ものくろ","まひろまる。",
"はりま","そあら"
];

let myHand = [];
let selected = [];
let exchanged = false;

function drawRandomCards(count){
  const shuffled = [...cards].sort(() => Math.random() - 0.5);
  return shuffled.slice(0, count);
}

function drawMyHand(){
  myHand = drawRandomCards(5);
  selected = [];
  exchanged = false;
  showMyHand();
}

function showMyHand(){
  let html = "";

  myHand.forEach((card,index)=>{
    const active = selected.includes(index);

    html += `
      <span class="card ${active ? "selected" : ""}"
      onclick="selectCard(${index})">
      ${card}
      </span>
    `;
  });

  document.getElementById("myHand").innerHTML = html;
}

function selectCard(index){
  if(selected.includes(index)){
    selected = selected.filter(i => i !== index);
  }else{
    selected.push(index);
  }

  showMyHand();
}

function exchangeCards(){
  if(myHand.length === 0){
    alert("先に手札を見てね！");
    return;
  }

  if(exchanged){
    alert("交換は1回だけだよ！");
    return;
  }

  if(selected.length === 0){
    alert("交換するカードを選んでね！");
    return;
  }

  const newCards = drawRandomCards(selected.length);

  selected.forEach((cardIndex,i)=>{
    myHand[cardIndex] = newCards[i];
  });

  selected = [];
  exchanged = true;

  showMyHand();
}

function send(){
  const name = document.getElementById("name").value;
  const answer = document.getElementById("answer").value;

  if(!name || !answer){
    alert("名前と役を書いてね！");
    return;
  }

  if(myHand.length === 0){
    alert("先に手札を見てね！");
    return;
  }

  db.collection("answers").add({
    name:name,
    answer:answer,
    hand:myHand,
    votes:0,
    time:Date.now()
  });
}

function vote(id){
  db.collection("answers").doc(id).update({
    votes: firebase.firestore.FieldValue.increment(1)
  });
}

function deleteAnswer(id){
  if(confirm("この発表を消す？")){
    db.collection("answers").doc(id).delete();
  }
}

function resetRound(){
  if(!confirm("全員の発表を消して次のラウンドに進む？")){
    return;
  }

  db.collection("answers").get().then(snapshot => {
    snapshot.forEach(doc => {
      db.collection("answers").doc(doc.id).delete();
    });
  });

  myHand = [];
  selected = [];
  exchanged = false;
  document.getElementById("myHand").innerHTML = "";
  document.getElementById("answer").value = "";
}

db.collection("answers").orderBy("time").onSnapshot(snapshot=>{
  let html = "";

  snapshot.forEach(doc=>{
    const data = doc.data();

    const handHtml = data.hand
      ? data.hand.map(card => `<span class="card">${card}</span>`).join("")
      : "";

    html += `
      <div class="box">
        <h3>${data.name}</h3>
        <div>${handHtml}</div>
        <p>役：${data.answer}</p>
        <button onclick="vote('${doc.id}')">投票</button>
        <span>${data.votes || 0}票</span>
        <br>
        <button onclick="deleteAnswer('${doc.id}')">発表を消す</button>
      </div>
    `;
  });

  document.getElementById("list").innerHTML = html;
});
</script>

</body>
</html>

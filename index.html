<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>人名ポーカー</title>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<style>
body { background:#222; color:white; text-align:center; font-family:sans-serif; }
input { padding:10px; margin:5px; }
button { padding:10px; margin:5px; }
.card {
  display:inline-block;
  background:white;
  color:black;
  padding:8px;
  margin:4px;
  border-radius:8px;
}
.box {
  margin:15px;
  padding:10px;
  border:1px solid #555;
}
</style>
</head>

<body>

<h1>🌐 人名ポーカー</h1>

<input id="name" placeholder="名前">
<input id="answer" placeholder="役を書く">
<button onclick="send()">送信</button>

<h2>みんなの回答</h2>
<div id="list"></div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyD2y8WmkIMZuu_JuAWlBVh_E1mTdK1QV3A",
  authDomain: "stpr-poker.firebaseapp.com",
  projectId: "stpr-poker",
  storageBucket: "stpr-poker.firebasestorage.app",
  messagingSenderId: "272158826675",
  appId: "1:272158826675:web:c6487013df9d9bc4e990c6",
  measurementId: "G-KJJNRKQ8Z6"
};",

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

const cards = [
  "田中", "佐藤", "鈴木", "高橋", "伊藤",
  "渡辺", "山本", "中村", "小林", "加藤",
  "吉田", "山田", "佐々木", "山口", "松本"
];

function drawCards(){
  const shuffled = [...cards].sort(() => Math.random() - 0.5);
  return shuffled.slice(0, 5);
}

function send(){
  const name = document.getElementById("name").value;
  const answer = document.getElementById("answer").value;
  const hand = drawCards();

  db.collection("answers").add({
    name: name,
    answer: answer,
    hand: hand,
    votes: 0,
    time: Date.now()
  });
}

function vote(id){
  db.collection("answers").doc(id).update({
    votes: firebase.firestore.FieldValue.increment(1)
  });
}

db.collection("answers").orderBy("time").onSnapshot(snapshot => {
  let html = "";

  snapshot.forEach(doc => {
    const data = doc.data();

    const handHtml = data.hand
      ? data.hand.map(card => `<span class="card">${card}</span>`).join("")
      : "";

    html += `
      <div class="box">
        <h3>${data.name}</h3>
        <div>${handHtml}</div>
        <p>役：${data.answer}</p>
        <button onclick="vote('${doc.id}')">投票</button>
        <span>${data.votes || 0}票</span>
      </div>
    `;
  });

  document.getElementById("list").innerHTML = html;
});
</script>

</body>
</html>
